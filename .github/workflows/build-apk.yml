name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.10.2

      - name: Restore Android debug keystore
        uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: android-debug-keystore-v1

      - name: Build debug APK
        run: gradle :app:assembleDebug

      - name: Export debug signing certificate info
        run: |
          keytool -list -v \
            -alias androiddebugkey \
            -keystore "$HOME/.android/debug.keystore" \
            -storepass android \
            -keypass android | tee debug-signing-certificate.txt

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: restaurant-inventory-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk

      - name: Upload signing certificate info
        uses: actions/upload-artifact@v4
        with:
          name: debug-signing-certificate
          path: debug-signing-certificate.txt
